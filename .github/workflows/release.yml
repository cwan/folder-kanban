name: Release

# Publishes a GitHub release with the .vsix attached. Two ways to start it:
#  - Push a tag like "v0.1.0" (must match "version" in package.json).
#  - Run this workflow manually from the Actions tab ("Run workflow"). The tag "v<version>" is
#    created from package.json on the selected branch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Determine tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
              exit 1
            fi
          elif gh release view "$version" >/dev/null 2>&1; then
            echo "::error::Release $version already exists. Bump the version in package.json first."
            exit 1
          fi
          echo "TAG=$version" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist-vsix/*.vsix \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            $([[ "$TAG" == *-* ]] && echo --prerelease)
